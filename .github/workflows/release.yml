name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}"; exit 1; }

      - name: Build DMG
        run: ./build.sh --dmg

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/RecMenu-*.dmg \
            --title "Rec Menu ${GITHUB_REF_NAME#v}" --generate-notes
